plugins { id 'com.android.application' }
def ciRunNumber = System.getenv('GITHUB_RUN_NUMBER')
def diagnosticVersionCode = ciRunNumber ? 4 + ciRunNumber.toInteger() : 4
def diagnosticVersionName = ciRunNumber ? "0.4-avatar-preview.build-${ciRunNumber}" : '0.4-avatar-preview-local'
def persistentKeystore = System.getenv('COMPANION_SIGNING_KEYSTORE')
if (System.getenv('GITHUB_ACTIONS') == 'true' && !persistentKeystore) {
 throw new GradleException('COMPANION_SIGNING_KEYSTORE is required in CI')
}
if (persistentKeystore && !file(persistentKeystore).isFile()) {
 throw new GradleException('Persistent diagnostic keystore does not exist')
}
def offlineSetup = providers.exec {
 workingDir rootProject.projectDir
 commandLine 'python3', rootProject.file('tools/prepare_offline_ai.py').absolutePath
}
offlineSetup.result.get().assertNormalExitValue()
logger.lifecycle(offlineSetup.standardOutput.asText.get())
android {
 namespace 'com.chase.companion'
 compileSdk 36
 defaultConfig {
  applicationId 'com.chase.companion'; minSdk 29; targetSdk 36; versionCode diagnosticVersionCode; versionName diagnosticVersionName
  ndk { abiFilters 'arm64-v8a' }
  externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
 }
 externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
 androidResources { noCompress += ['gguf'] }
 signingConfigs {
  debug {
   if (persistentKeystore) {
    storeFile file(persistentKeystore)
    storePassword 'android'
    keyAlias 'androiddebugkey'
    keyPassword 'android'
    storeType 'JKS'
   }
  }
 }
 buildTypes { debug { signingConfig signingConfigs.debug } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets { main {
  assets.srcDir(layout.buildDirectory.dir('generated/avatarAssets').get().asFile)
  assets.srcDir(rootProject.file('vendor/offline-assets'))
  res.srcDir(layout.buildDirectory.dir('generated/brandingRes').get().asFile)
 } }
}
kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }
dependencies {
 implementation files(rootProject.file('vendor/filament/filament-v1.75.0-android.aar'))
 implementation files(rootProject.file('vendor/filament/gltfio-v1.75.0-android.aar'))
 implementation files(rootProject.file('vendor/filament/filament-utils-v1.75.0-android.aar'))
 implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.4.0'
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
 implementation 'androidx.annotation:annotation:1.9.0'
}
def avatarFiles = ['roxanne_wolf_security_breach.glb', 'fexa_blush_alt_nude.glb', 'loona.glb']
def copyAvatar = tasks.register('copyAvatar', Sync) {
 avatarFiles.each { from(rootProject.file(it)) }
 into(layout.buildDirectory.dir('generated/avatarAssets'))
 doFirst { avatarFiles.each { if (!rootProject.file(it).isFile()) throw new GradleException('Missing avatar: ' + it) } }
}
def copyBranding = tasks.register('copyBranding', Sync) {
 from(rootProject.file('Alongside_crystalline_heart_br.jpeg')) {
  rename { 'alongside_logo.jpg' }
  into 'drawable-nodpi'
 }
 into(layout.buildDirectory.dir('generated/brandingRes'))
 doFirst { if (!rootProject.file('Alongside_crystalline_heart_br.jpeg').isFile()) throw new GradleException('Alongside logo missing at repository root') }
}
tasks.named('preBuild').configure { dependsOn(copyAvatar, copyBranding) }
tasks.matching { it.name == 'assembleDebug' }.configureEach {
 doLast {
  new java.util.zip.ZipFile(file('build/outputs/apk/debug/app-debug.apk')).withCloseable { apk ->
   ['assets/offline/model.json', 'assets/offline/qwen3-0.6b-q4_k_m.gguf', 'assets/offline/MODEL-LICENSE.txt', 'assets/offline/LLAMA-LICENSE.txt', 'lib/arm64-v8a/libalongside_offline.so'].each {
    if (apk.getEntry(it) == null) throw new GradleException('Offline APK component missing: ' + it)
   }
   logger.lifecycle('Verified bundled model, licenses and native offline inference library in APK.')
  }
 }
}
