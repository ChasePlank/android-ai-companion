name: Audition Roxy quarter rise
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audition-roxy-quarter-rise.yml'
      - 'tools/audition_roxy_quarter_rise.py'
permissions:
  contents: read
  actions: read
jobs:
  audition:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      TORCH_FORCE_WEIGHTS_ONLY_LOAD: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Initialize short report
        run: python tools/audition_roxy_quarter_rise.py --initialize
      - name: Check out pinned synthesizer source
        uses: actions/checkout@v6
        with:
          repository: RVC-Project/Retrieval-based-Voice-Conversion-WebUI
          ref: 81eed5e8f68b6bed1789f682fe78cdd324495afc
          path: vendor-rvc
          persist-credentials: false
          sparse-checkout: |
            infer/module
            LICENSE
      - name: Retrieve exact original slow clip and prior alignment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/40843385561" --jq '.head_sha == "9dcaa110a801ab3c4c8b06df9ea193411252a3c2" and .conclusion == "success" and .head_branch == "main"' | grep -qx true
          gh run download 40843385561 --repo "$GITHUB_REPOSITORY" --name roxy-final-rise-baselines --dir rise-source
      - name: Retrieve validated ONNX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/export-roxy-voice.yml/runs" -f status=success -f branch=main -f per_page=100 --jq '.workflow_runs | map(select(.head_sha == "b4717ca074d66b0e2913384546edfb4c9431ca67")) | .[0].id // empty')
          [[ "$RUN" =~ ^[0-9]+$ ]] || exit 1
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name roxy-synthesizer-onnx --dir voice-model
          echo "SOURCE_EXPORT_RUN_ID=$RUN" >> "$GITHUB_ENV"
      - name: Install CPU voice-edit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6'
          python -m pip install --only-binary=:all: numpy scipy onnxruntime 'transformers>=4.45,<5' praat-parselmouth
          python -m pip freeze > quarter-rise/python-packages.txt
      - name: Edit original baseline and convert once
        run: python tools/audition_roxy_quarter_rise.py
      - name: Upload short diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: roxy-quarter-rise-report
          path: |
            quarter-rise/report.txt
            quarter-rise/report.json
            quarter-rise/python-packages.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Upload reference and candidate only
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: roxy-quarter-rise-audio
          path: |
            quarter-rise/reference.wav
            quarter-rise/candidate.wav
          if-no-files-found: error
          retention-days: 7
