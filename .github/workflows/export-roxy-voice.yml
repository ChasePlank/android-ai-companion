name: Export Roxy voice synthesizer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-roxy-voice.yml'
      - 'tools/export_roxy_synthesizer.py'
      - 'tools/export_roxy_with_attention_fix.py'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out pinned official RVC model code
        uses: actions/checkout@v6
        with:
          repository: RVC-Project/Retrieval-based-Voice-Conversion-WebUI
          ref: 81eed5e8f68b6bed1789f682fe78cdd324495afc
          path: vendor-rvc
          persist-credentials: false
          sparse-checkout: |
            infer/module
            LICENSE
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Initialize compact report
        run: |
          mkdir -p voice-export
          printf 'Export has not started. If this remains unchanged, check the dependency-install or checkout step.\n' > voice-export/roxy-export-report.txt
      - name: Install CPU export dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6'
          python -m pip install --only-binary=:all: numpy scipy onnx onnxruntime
          python -m pip freeze > voice-export/python-packages.txt
      - name: Shape-safe attention, restricted weights load and numerical validation
        env:
          TORCH_FORCE_WEIGHTS_ONLY_LOAD: '1'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python tools/export_roxy_with_attention_fix.py --upstream vendor-rvc
      - name: Upload small readable report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: roxy-export-report
          path: |
            voice-export/roxy-export-report.txt
            voice-export/roxy-export-report.json
            voice-export/python-packages.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Upload validated synthesizer core only
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: roxy-synthesizer-onnx
          path: |
            voice-export/roxanne-synthesizer.onnx
            voice-export/manifest.json
            voice-export/RVC-LICENSE
          if-no-files-found: error
          retention-days: 7
