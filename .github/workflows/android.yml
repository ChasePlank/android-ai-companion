name: Build diagnostic APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Apply and verify integrated companion behavior
        run: python3 tools/apply_companion_behavior.py
      - name: Stage inspection-only avatar variants
        run: python3 tools/prepare_node_variants.py
      - name: Apply testing UI, pose studio, developer controls and Qwen3-4B integration
        run: |
          python3 -m py_compile tools/apply_testing_features.py
          python3 tools/apply_testing_features.py
      - uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '27'
      - name: Restore persistent diagnostic signing key
        shell: bash
        env:
          COMPANION_DEBUG_KEYSTORE_BASE64: ${{ secrets.COMPANION_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$COMPANION_DEBUG_KEYSTORE_BASE64" || { echo '::error::Missing existing signing key; do not generate a replacement.'; exit 1; }
          umask 077
          keyfile="$RUNNER_TEMP/companion-signing.jks"
          printf '%s' "$COMPANION_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          test -s "$keyfile"
          keytool -list -storetype JKS -keystore "$keyfile" -storepass android -alias androiddebugkey > /dev/null
          echo "COMPANION_SIGNING_KEYSTORE=$keyfile" >> "$GITHUB_ENV"
      - name: Install Android API 36
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install 'platforms;android-36'
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - name: Fetch and verify official Filament AARs
        run: python3 tools/fetch_filament.py
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
      - name: Assemble debug APK
        run: gradle --no-daemon --console=plain --stacktrace :app:assembleDebug
      - name: Verify packaged inspection models
        run: python3 tools/prepare_node_variants.py --verify-apk
      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          test -n "$apksigner"
          keytool -exportcert -storetype JKS -keystore "$COMPANION_SIGNING_KEYSTORE" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/companion-cert.der"
          expected=$(sha256sum "$RUNNER_TEMP/companion-cert.der" | awk '{print $1}')
          "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature.txt"
          actual=$(sed -nE 's/^(Signer #[0-9]+|V2 Signer:) certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt" | tr -d ':\r ' | tr '[:upper:]' '[:lower:]')
          count=$(grep -cE '^(Signer #[0-9]+|V2 Signer:) certificate SHA-256 digest:' "$RUNNER_TEMP/apk-signature.txt" || true)
          test "$count" = 1 && test "$actual" = "$expected" || { echo '::error::Signing mismatch; upload blocked.'; exit 1; }
          echo 'Experimental testing APK compiled and signed. UI, pose timing, camera resets, model gates and Qwen performance require device testing.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: alongside-testing-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: alongside-built-source-${{ github.run_number }}
          path: |
            app/src/main/AndroidManifest.xml
            app/src/main/java/com/chase/companion/
            vendor/offline-assets/offline/model.json
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/companion-signing.jks" "$RUNNER_TEMP/companion-cert.der"
