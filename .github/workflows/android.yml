name: Build diagnostic APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '27'
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          if ! "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install 'platforms;android-36' > "$RUNNER_TEMP/sdk-install.txt" 2>&1; then
            {
              echo '## API 36 installation failed'
              echo '```text'
              tail -n 20 "$RUNNER_TEMP/sdk-install.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 20 "$RUNNER_TEMP/sdk-install.txt"
            exit 1
          fi
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          echo '## Building with API 36 and Filament 1.75.0' >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch and verify official Filament AARs
        run: python3 tools/fetch_filament.py
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
      - name: Print build runtime versions
        run: |
          java -version
          gradle --version
      - name: Assemble debug APK
        shell: bash
        run: |
          set -uo pipefail
          gradle --no-daemon --console=plain --stacktrace :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '## Build failure: first diagnostic lines'
              echo '```text'
              grep -m 12 -A 2 -E '^e:|^error:|incompatible version|binary version|metadata version|requires libraries|requires.*version|^\* What went wrong:|^Execution failed|^> ' "$RUNNER_TEMP/gradle-build.log" | head -n 45 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Debug APK build succeeded' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - uses: actions/upload-artifact@v7
        with:
          name: companion-diagnostic-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
