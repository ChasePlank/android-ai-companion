name: Build diagnostic APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '27'
      - name: Restore persistent diagnostic signing key
        shell: bash
        env:
          COMPANION_DEBUG_KEYSTORE_BASE64: ${{ secrets.COMPANION_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$COMPANION_DEBUG_KEYSTORE_BASE64" ]; then
            echo '::error::Missing COMPANION_DEBUG_KEYSTORE_BASE64 repository secret. Reuse the existing key; do not generate a new one.'
            exit 1
          fi
          umask 077
          keyfile="$RUNNER_TEMP/companion-signing.jks"
          printf '%s' "$COMPANION_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          test -s "$keyfile"
          keytool -list -storetype JKS -keystore "$keyfile" -storepass android -alias androiddebugkey > /dev/null
          echo "COMPANION_SIGNING_KEYSTORE=$keyfile" >> "$GITHUB_ENV"
          echo '## Persistent diagnostic signing key restored' >> "$GITHUB_STEP_SUMMARY"
          echo "Version code: $((GITHUB_RUN_NUMBER + 4))" >> "$GITHUB_STEP_SUMMARY"
          echo "Version name: 0.4-avatar-preview.build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          if ! "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install 'platforms;android-36' > "$RUNNER_TEMP/sdk-install.txt" 2>&1; then
            {
              echo '## API 36 installation failed'
              echo '```text'
              tail -n 20 "$RUNNER_TEMP/sdk-install.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 20 "$RUNNER_TEMP/sdk-install.txt"
            exit 1
          fi
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          echo '## Building with API 36 and Filament 1.75.0' >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch and verify official Filament AARs
        run: python3 tools/fetch_filament.py
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
      - name: Print build runtime versions
        run: |
          java -version
          gradle --version
      - name: Assemble debug APK
        shell: bash
        run: |
          set -uo pipefail
          gradle --no-daemon --console=plain --stacktrace :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '## Build failure: first diagnostic lines'
              echo '```text'
              grep -m 12 -A 2 -E '^e:|^error:|incompatible version|binary version|metadata version|requires libraries|requires.*version|^\* What went wrong:|^Execution failed|^> ' "$RUNNER_TEMP/gradle-build.log" | head -n 45 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Debug APK build succeeded' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$apksigner" ]; then
            echo '::error::apksigner was not found in Android build-tools.'
            exit 1
          fi
          keytool -exportcert -storetype JKS -keystore "$COMPANION_SIGNING_KEYSTORE" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/companion-cert.der"
          expected=$(sha256sum "$RUNNER_TEMP/companion-cert.der" | awk '{print $1}')
          "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature.txt"
          actual=$(sed -nE 's/^(Signer #[0-9]+|V2 Signer:) certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt" | tr -d ':\r ' | tr '[:upper:]' '[:lower:]')
          count=$(grep -cE '^(Signer #[0-9]+|V2 Signer:) certificate SHA-256 digest:' "$RUNNER_TEMP/apk-signature.txt" || true)
          {
            echo '## Public signing diagnostics'
            echo "apksigner path: $apksigner"
            echo "Expected certificate SHA-256: $expected"
            echo "Extracted certificate SHA-256: ${actual:-<empty>}"
            echo "Matched signer count: $count"
            echo '```text'
            cat "$RUNNER_TEMP/apk-signature.txt"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$count" != 1 ] || [ "$actual" != "$expected" ]; then
            echo '::error::APK signer does not match the persistent keystore. Artifact upload blocked.'
            exit 1
          fi
          {
            echo '## APK signing certificate verified'
            echo "Certificate SHA-256: $actual"
            echo "APK SHA-256: $(sha256sum "$apk" | awk '{print $1}')"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: companion-diagnostic-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Remove runner signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/companion-signing.jks" "$RUNNER_TEMP/companion-cert.der"
