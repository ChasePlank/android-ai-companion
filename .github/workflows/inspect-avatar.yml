name: Inspect Roxanne model
on:
  workflow_dispatch:
  push:
    paths:
      - 'roxanne_wolf_security_breach.glb'
      - '.github/workflows/inspect-avatar.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Inspect GLB structure
        shell: python
        run: |
          import collections, json, os, pathlib, struct
          path = pathlib.Path('roxanne_wolf_security_breach.glb')
          data = path.read_bytes()
          if len(data) < 20:
              raise ValueError('File too short for GLB')
          magic, version, length = struct.unpack_from('<4sII', data)
          if magic != b'glTF' or version != 2 or length != len(data):
              raise ValueError('Invalid GLB 2 header or file length')
          offset, document, chunks = 12, None, []
          while offset < len(data):
              if offset + 8 > len(data):
                  raise ValueError('Truncated chunk header')
              size, kind = struct.unpack_from('<II', data, offset)
              offset += 8
              if offset + size > len(data):
                  raise ValueError('Truncated chunk payload')
              payload = data[offset:offset + size]
              chunks.append({'type': kind, 'bytes': size})
              if kind == 0x4e4f534a:
                  document = json.loads(payload.decode('utf-8').rstrip(' \x00'))
              offset += size
          if document is None:
              raise ValueError('No JSON chunk found')
          nodes = document.get('nodes', [])
          meshes = document.get('meshes', [])
          accessors = document.get('accessors', [])
          def label(index):
              return nodes[index].get('name', 'node_' + str(index)) if 0 <= index < len(nodes) else 'INVALID_' + str(index)
          skins = []
          for skin in document.get('skins', []):
              skins.append({'name': skin.get('name', ''), 'joints': [label(i) for i in skin.get('joints', [])]})
          morphs, triangles = [], 0
          for mesh in meshes:
              primitives = mesh.get('primitives', [])
              count = max([len(p.get('targets', [])) for p in primitives] or [0])
              if count:
                  morphs.append({'mesh': mesh.get('name', ''), 'target_count': count, 'target_names': mesh.get('extras', {}).get('targetNames', [])})
              for p in primitives:
                  if p.get('mode', 4) == 4:
                      index = p.get('indices', p.get('attributes', {}).get('POSITION'))
                      if index is not None:
                          triangles += accessors[index].get('count', 0) // 3
          animations = []
          for animation in document.get('animations', []):
              channels = animation.get('channels', [])
              animations.append({'name': animation.get('name', ''), 'channel_count': len(channels), 'paths': dict(collections.Counter(c.get('target', {}).get('path', 'unknown') for c in channels))})
          images = [{'name': image.get('name', ''), 'mimeType': image.get('mimeType', ''), 'embedded_buffer_view': image.get('bufferView'), 'uri': image.get('uri')} for image in document.get('images', [])]
          external = [item['uri'] for group in ('images', 'buffers') for item in document.get(group, []) if 'uri' in item and not item['uri'].startswith('data:')]
          report = {'file': str(path), 'bytes': len(data), 'asset': document.get('asset', {}), 'chunks': chunks, 'mesh_count': len(meshes), 'node_count': len(nodes), 'triangle_list_count': triangles, 'skins': skins, 'morph_targets': morphs, 'animations': animations, 'images': images, 'external_resources': external, 'materials': [m.get('name', '') for m in document.get('materials', [])], 'extensions_used': document.get('extensionsUsed', []), 'extensions_required': document.get('extensionsRequired', [])}
          pathlib.Path('avatar-inspection.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          summary = '\n'.join(['# Roxanne GLB inspection', '', 'Structural inventory only: not a visual render, full validator, performance test, or licensing verification.', '', '- File size: ' + str(len(data)) + ' bytes', '- Meshes: ' + str(len(meshes)), '- Nodes: ' + str(len(nodes)), '- Triangle-list triangles: ' + str(triangles), '- Skins: ' + str(len(skins)), '- Meshes with morph targets: ' + str(len(morphs)), '- Animation clips: ' + str(len(animations)), '- Images: ' + str(len(images)), '- External resources: ' + str(len(external)), '', '## Detailed report', '```json', json.dumps(report, indent=2), '```', ''])
          pathlib.Path('avatar-inspection.md').write_text(summary, encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write(summary)
          print(summary)
      - uses: actions/upload-artifact@v7
        with:
          name: roxanne-structural-inspection
          path: |
            avatar-inspection.json
            avatar-inspection.md
          if-no-files-found: error
